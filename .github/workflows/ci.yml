name: ci

# Everything here runs on CPU with no hardware attached. That is a design constraint,
# not a limitation: if the frame cannot be verified on a plain runner, a contributor
# cannot verify it on a laptop either.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: layer boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step. test_boundaries.py reads source with ast rather than
      # importing, so it runs on a bare checkout — which is what makes it a
      # meaningful check of what the kernel depends on.
      - name: install pytest only
        run: python -m pip install --quiet pytest

      - name: enforce import rules
        run: python -m pytest tests/unit/test_boundaries.py -q

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      # No paths here. They are in pyproject.toml, because this step said `src tests
      # scripts` while everyone typing it locally said `src tests examples`, so
      # `examples/` was gated by nobody and `scripts/` was linted by nobody until CI ran.
      - run: ruff check .
      - run: ruff format --check .

  types:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # types-PyYAML so the yaml calls in `services/limits.py` are checked rather than
      # skipped. That module reads the local safety ceiling.
      - run: python -m pip install --quiet mypy pydantic types-PyYAML
      # No flags and no paths: both are in pyproject.toml, so `mypy` here and `mypy` on a
      # developer's machine are the same check. `--ignore-missing-imports` lived only in
      # this file, which made the local run report errors CI could not see.
      - run: mypy

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [view] is here for one reason: without rerun-sdk the whole of
      # tests/unit/test_viz.py skips, and that is 27 tests covering the logger that
      # subscribes to the episode bus. A subscriber that raises fails the run it was
      # only supposed to be watching, so it is not a module to leave ungated.
      # [sim], [robot] and [train] stay out. torch alone is ~800MB across three Python
      # versions to reach 12 more tests, which is the wrong trade for a job meant to
      # answer quickly.
      - run: python -m pip install --quiet -e ".[dev,view]"
      - run: python -m pytest tests/unit -q

  integration:
    name: integration (simulated body)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Nothing was running these. Eight integration files, sixty tests, and the ones
      # that check the claims this project leads with -- that a body moves, that a
      # correction loop closes -- had never executed on a runner.
      #
      # These three need mujoco and nothing else: no rendering, so no GL on a headless
      # box, and they finish in about two seconds. The menagerie scenes are vendored
      # under third_party/, so a fresh checkout has everything they load.
      #
      # A named list is right here and wrong below. The whole directory cannot run in this
      # environment -- the files that need lerobot import it at module scope and fail
      # collection rather than skipping -- so this job takes the subset that works without
      # it, for a signal that arrives in seconds. It is not the coverage guarantee, and a
      # new file missing from this list loses nothing: the recording job runs everything.
      - run: python -m pip install --quiet -e ".[dev,sim]"
      - run: >
          python -m pytest
          tests/integration/test_correction_loop.py
          tests/integration/test_improve_example.py
          tests/integration/test_mujoco_episode.py
          -q

  recording:
    name: integration (recording)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # lerobot declares requires-python >=3.12. See the [robot] extra in pyproject.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # torch from the CPU index before anything asks for it, so lerobot's dependency is
      # already satisfied and pip does not fetch the CUDA build for a runner with no GPU
      # to use it. Measured: 192 MB against 527 MB.
      - run: >
          python -m pip install --quiet torch
          --index-url https://download.pytorch.org/whl/cpu
      # The README's own command, with nothing added to it. Two bugs this session were
      # the same shape -- install as documented, get a broken system. One was a pin naming
      # a lerobot version that was never released; the other was a quickstart missing the
      # extra that does the recording. Both survived because every machine that ran them
      # already had everything installed, so nobody ever executed the documented command.
      #
      # Installing [dev] at the same time would hide the next one: a runtime dependency
      # that only dev provides looks fine until a user follows the page.
      - run: python -m pip install --quiet -e ".[sim,robot]"
      - name: the documented install records an episode
        run: |
          tendon doctor
          tendon run grasp/cube-sim --steps 20 --store "$RUNNER_TEMP/episodes"
          tendon episodes --store "$RUNNER_TEMP/episodes"
          # An episode on disk, not just a command that exited 0. "Recorded to ..." printed
          # by a run that wrote nothing is exactly what the README promised and did not do.
          test -n "$(find "$RUNNER_TEMP/episodes" -name '*.parquet' -print -quit)"
      - run: python -m pip install --quiet -e ".[dev,sim,robot]"
      # The whole directory, deliberately, rather than a list of files. The first version
      # of this job named five, and within the hour two new integration files existed that
      # matched none of them. This repository already learned that in bodies.py: a list you
      # have to remember to update is a list that will be wrong.
      #
      # This job has every extra installed, so nothing here has to skip, and a file added
      # tomorrow is covered without anyone editing this workflow. It is the coverage
      # guarantee; the job above is only a fast subset.
      # Three fixes have been aimed at this abort from inference and none of them was
      # right, so this run is for evidence rather than a fourth guess. faulthandler
      # installs a SIGABRT handler and dumps every thread's Python stack, which names
      # whatever is still alive when the interpreter tears down. The suite reports all
      # tests passing and then exits 134; nothing about that says which thread.
      #
      # Costs nothing when the job is green.
      - run: python -m pytest tests/integration -q
        env:
          # Kept after the incident it was added for. It dumps every thread's stack on
          # SIGABRT, and it is what turned "exit 134 after all tests passed" into a
          # readable cause. Free on a green run.
          PYTHONFAULTHANDLER: "1"
          # Ends the process once pytest has finished, before the native static destructors
          # that abort. See the pytest_unconfigure hook in tests/conftest.py for what that
          # skips and why it is scoped to this job alone.
          #
          # OMP_NUM_THREADS and MKL_NUM_THREADS were here too, on the theory that the
          # abort was torch's OpenMP pool tearing down. Pinning both to one thread changed
          # nothing, so the theory was wrong and the settings are gone. Leaving them would
          # have left this file asserting a cause that had already been ruled out, which is
          # how a workflow accumulates settings nobody can explain.
          TENDON_EXIT_WITHOUT_TEARDOWN: "1"

  shell:
    name: shell builds and type-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
        working-directory: shell
      # The arithmetic behind what an operator sees and what a robot does. A drawing
      # that is subtly wrong is worse than one that is missing.
      - run: npm test
        working-directory: shell
      # tsc runs with exactOptionalPropertyTypes and noUncheckedIndexedAccess, so this
      # catches the class of mistake that only shows up when an operator is looking at it.
      - run: npm run build
        working-directory: shell

  provenance:
    name: ported code carries provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every third_party directory declares its origin
        run: |
          if [ ! -d third_party ]; then
            echo "no ported code yet"
            exit 0
          fi
          fail=0
          for d in third_party/*/; do
            [ -d "$d" ] || continue
            for required in PROVENANCE.md LICENSE; do
              if [ ! -f "$d$required" ]; then
                echo "MISSING: $d$required"
                fail=1
              fi
            done
          done
          exit $fail
