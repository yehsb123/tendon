name: readme sync

# The command list, the Built on table and the folder listing in README.md and README.ko.md
# are generated by scripts/sync_readme.py. This keeps main's copy current after a push that
# changed what they are generated from, so a renamed command or a new driver does not wait
# for somebody to remember the README.
#
# Three things keep the bot's own commit from starting this again:
#   - it is pushed with the default GITHUB_TOKEN, and GitHub does not start workflows for
#     pushes made with that token;
#   - the paths below do not include the READMEs, and that commit touches nothing else;
#   - the job is skipped when the actor is github-actions[bot].
# Any one of them would do. All three are here so that changing the token to a PAT one day,
# which would make pushes trigger workflows, does not turn this into a loop.

on:
  push:
    branches: [main]
    paths:
      - "src/tendon/**"
      - "shell/src/**"
      - "pyproject.toml"
      - "scripts/sync_readme.py"
      - ".github/workflows/readme-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

# One at a time, and none cancelled: a cancelled run is a README left behind the code.
concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  sync:
    name: regenerate README sections
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The base install only. The script reads the Typer app, which imports typer and rich
      # and nothing heavy; installing extras here would hide the day that stops being true.
      - run: python -m pip install --quiet -e .
      # Fails, and so does this job, when the code has something the script cannot write
      # on its own: a command with no Korean description, a library the table names and
      # pyproject.toml does not declare, a directory nobody described.
      - run: python scripts/sync_readme.py
      - name: commit and push if anything changed
        run: |
          if git diff --quiet -- README.md README.ko.md; then
            echo "README sections already match the code"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README.ko.md
          git commit -m "docs: README 자동 동기화 / sync generated README sections"
          # main may have moved while this ran. The run queued for that push regenerates
          # from the newer code, so landing this one on top is safe.
          git pull --rebase origin main
          git push origin HEAD:main
