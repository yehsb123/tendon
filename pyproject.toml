[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendon-os"
version = "0.1.0.dev0"
description = "The operating layer for physical AI — every run becomes data, every human correction becomes a lesson."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "yehsb123" }]
keywords = [
    "physical-ai", "robotics", "vla", "human-in-the-loop",
    "imitation-learning", "robot-learning", "lerobot",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kernel only. Deliberately thin — heavy stacks are optional extras
# so that `pip install tendon-os` stays fast and driver-agnostic.
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim   = ["mujoco>=3.1", "gymnasium>=0.29"]
# 0.6.1 is the newest release on PyPI, and the bound said >=0.6.2 for months: a version
# that does not exist, so `pip install -e ".[robot]"` could not succeed for anyone
# starting from a clean environment. It went unnoticed because this machine already had
# lerobot installed, so the command was never run clean, and because no CI job installed
# this extra until one did and failed on the first try.
#
# LeRobot 0.6.1 declares requires-python >=3.12, while tendon supports >=3.10. Pinning
# the lower bound makes that collision an explicit resolution failure on 3.10 and 3.11
# instead of a silent downgrade to an ancient release that happens to allow 3.10 — which
# would install, import, and then behave nothing like the documented API.
#
# The kernel and the MuJoCo driver stay on 3.10, so only this extra is affected. Raising
# requires-python for the whole project to satisfy one optional extra would push the
# constraint onto everyone, including contributors who never install it.
# The [dataset] extra is required, not optional: LeRobotDataset needs it, and it
# pins av>=15,<16. A bare install resolves av 18.x, which imports and then fails
# with "module av has no attribute option" the first time a dataset is opened.
robot = ["lerobot[dataset]>=0.6.1"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "accelerate>=0.33"]
view  = ["rerun-sdk>=0.17"]
dev   = [
  "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10",
  # Real stubs rather than `--ignore-missing-imports`. `services/limits.py` and
  # `services/skill.py` both parse YAML, and ignoring the import tells mypy to skip the
  # calls rather than check them — on the module that reads the safety ceiling.
  "types-PyYAML",
  # fastapi.testclient goes through starlette.testclient, which needs an HTTP
  # client it does not itself depend on. starlette <1.0 asks for `httpx` and
  # >=1.0 asks for `httpx2`; CI resolves to the newer one, so a machine with an
  # older starlette already installed passes locally and fails there.
  "httpx2",
]
all   = ["tendon-os[sim,robot,train,view]"]

[project.scripts]
tendon = "tendon.cli.main:app"

[project.urls]
Homepage = "https://github.com/yehsb123/tendon"
Source = "https://github.com/yehsb123/tendon"
Issues = "https://github.com/yehsb123/tendon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tendon"]

[tool.ruff]
line-length = 100
target-version = "py310"

# What "the lint" covers, in one place. CI ran `ruff check src tests scripts` and the
# habit here was `src tests examples`, so `examples/` was linted by nobody in CI and
# `scripts/` by nobody locally — two commands with the same name checking different
# things, which is how a directory ends up ungated without anyone deciding it should be.
src = ["src"]
extend-include = ["examples/**/*.py", "scripts/**/*.py"]
# Prose is not source. Ruff formats Python inside fenced blocks, and the sample under
# "Units are mandatory" in CONTRIBUTING.md is aligned in columns to be read, not compiled.
# A formatter that rewrites documentation to its own taste makes the document worse at the
# one job it has.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Also in one place, and for the same reason. CI ran mypy with
# `--ignore-missing-imports` and nothing else did, so `mypy src/tendon` locally reported
# an error CI could not see. Flags that live only in a workflow file make the local run a
# different check wearing the same name.
files = ["src/tendon"]
python_version = "3.10"
# Stubs are installed (`types-PyYAML` in [dev]) rather than the import ignored, so mypy
# actually reads the yaml calls instead of being told not to look.
ignore_missing_imports = false

# The libraries that ship no type information, named one by one rather than waved away
# with a global `--ignore-missing-imports`. Naming them is what makes the check the same
# in both places it runs: CI installs only mypy and pydantic, so every one of these is
# unresolvable there, while a developer machine has them installed but unstubbed. The
# global flag hid both, which is why `mypy src/tendon` locally and the CI step disagreed
# about whether this project type-checks.
#
# The point of a list is that it ends. An import of something new fails until somebody
# decides it belongs here, which is the decision the global flag was making silently.
[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "gymnasium.*",
    "huggingface_hub.*",
    "lerobot.*",
    "mujoco.*",
    "rerun.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: tests import tendon without an editable install, so a bare
# checkout can run the unit suite. CI depends on this.
#
# `.` as well, so `tests/cli_source.py` is importable as `tests.cli_source`. Several
# structural tests assert a property of the whole command layer, and they each used to
# name `src/tendon/cli/main.py`; when that file was split every one of them broke and not
# one of the properties had changed. Sharing the reader keeps the property stated once.
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "hardware: needs a GPU or a physical robot; skipped by default",
]
